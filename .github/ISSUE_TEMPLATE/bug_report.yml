name: 🐛 Bug 报告
description: 报告一个可复现的问题
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 Bug 报告！请尽量提供完整信息，方便我们复现与修复。
  - type: textarea
    id: what-happened
    attributes:
      label: 问题描述
      description: 发生了什么？与你的预期有何不同？
      placeholder: 清晰地描述 bug
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      description: 如何稳定地复现这个问题？
      placeholder: |
        1. 执行 '...'
        2. 点击 '...'
        3. 看到错误 '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
      description: 你期望发生什么？
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境信息
      description: 操作系统 / 版本号 / 运行时版本等
      placeholder: "macOS 14 / Node 20 / v1.2.3"
  - type: textarea
    id: logs
    attributes:
      label: 相关日志 / 截图
      description: 如有报错日志或截图，请粘贴在此（勿包含密钥）
      render: shell
